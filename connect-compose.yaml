name: connect
services:
  keycloak:
    container_name: keycloak
    image: "quay.io/keycloak/keycloak:26.6.2"
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
      - KC_DB=${KC_POSTGRES_DB}
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/${KC_POSTGRES_DB}
      - KC_DB_USERNAME=${KC_POSTGRES_USER}
      - KC_DB_PASSWORD=${KC_POSTGRES_PASSWORD}
    ports:
      - "8079:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    container_name: keycloak-db
    image: "postgres:latest"
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${KC_POSTGRES_USER}
      - POSTGRES_PASSWORD=${KC_POSTGRES_PASSWORD}
      - POSTGRES_DB=${KC_POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -d ${KC_POSTGRES_DB} -U ${KC_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql

  backend-db:
    container_name: backend-db
    image: "postgres:latest"
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5434:5434"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"
    volumes:
      - postgres_data:/var/lib/postgresql

  inmemory:
    container_name: inmemory
    image: "redis:latest"
    ports:
      - "6380:6380"
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test:
        # 패스워드 사용 시 cli 뒤 -a ${REDIS_PASSWORD} 추가
        ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    labels:
      - "traefik.enable=false"
    volumes:
      - redis_data:/data

  cn-backend:
    container_name: cn-backend
    labels:
      - "traefik.enable=true"
    build:
      context: ./back
      dockerfile: Dockerfile
      args:
        - JAR_FILE=build/libs/connect-0.0.1-SNAPSHOT.jar
    ports:
      - 8082:8080
    environment:
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=debug
      - SPRING_PROFILES_ACTIVE=dev
      - SECERET_KEY=${SECERET_KEY}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GMAIL_APP_USERNAME=${GMAIL_APP_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - KEYCLOAK_JWT_SET_URI=${KEYCLOAK_JWT_SET_URI}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_USERNAME=${KEYCLOAK_USERNAME}
      - KEYCLOAK_PASSWORD=${KEYCLOAK_PASSWORD}
      - KEYCLOAK_SECRET=${KEYCLOAK_SECRET}
      - KEYCLOAK_GMAIL_REDIRECT=${KEYCLOAK_GMAIL_REDIRECT}
      - KEYCLOAK_GITHUB_REDIRECT=${KEYCLOAK_GITHUB_REDIRECT}
    depends_on:
      backend-db:
        condition: service_healthy
      inmemory:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  keycloak_postgres_data:
