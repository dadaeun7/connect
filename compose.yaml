name: connect
services:
    postgres:
        container_name: connect-postgres
        image: "postgres:latest"
        restart: always
        shm_size: 128mb
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql

    redis:
        container_name: connect-redis
        image: "redis:latest"
        ports:
            - "6379:6379"
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
    front:
        build:
            context: ./front
            dockerfile: Dockerfile.dev
        image: nextjs-sample:dev
        container_name: nextjs-sample-dev
        ports:
            - "3000:3000"
        environment:
            # Docker 내부에서 파일 변경 사항이 제대로 감지되도록 함
            - WATCHPACK_POLLING=true
        develop:
            # Compose Watch를 사용하여 파일 동기화를 시작
            watch:
                - action: sync
                  path: .
                  target: /app
                  ignore:
                      - node_modules/
                      - .next/
                # rebuild작업은 package.json파일이 변경될 때 종속성이 다시 설치되도록 함
                - action: rebuild
                  path: package.json

    backend:
        build:
            context: ./back
            dockerfile: Dockerfile.dev
            args:
                - JAR_FILE=./build/libs/*.jar
        ports:
            - 8080:8080
        environment:
            - SPRING_PROFILES_ACTIVE=dev
        depends_on:
            - postgres
            - redis

volumes:
    postgres_data:
    redis_data:
